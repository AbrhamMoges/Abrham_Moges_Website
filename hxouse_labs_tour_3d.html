<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HXOUSE Abe Lanyard — 3D</title>
    <style>
      html {
        background: transparent;
        height: 100%;
        width: 100%;
        overflow: visible;
        scrollbar-width: none;
      }
      html::-webkit-scrollbar { display: none; }
      body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: visible;
        scrollbar-width: none;
      }
      body::-webkit-scrollbar { display: none; }
      #wrap {
        width: 100%;
        height: 100%;
        max-width: min(480px, 78vmin);
        max-height: min(640px, 104vmin);
        aspect-ratio: 3 / 4;
        box-sizing: border-box;
      }
      #c {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="c"></canvas></div>

    <script src="lib/three.r128.min.js"></script>
    <script src="lib/GLTFLoader.r128.js"></script>
    <script>
      (function () {
        const wrap   = document.getElementById("wrap");
        const canvas = document.getElementById("c");

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.4;
        renderer.shadowMap.enabled = true;

        const scene  = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(42, 1, 0.01, 500);
        camera.position.set(0, 0, 5);

        /* Lighting */
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const key = new THREE.DirectionalLight(0xffffff, 2.0);
        key.position.set(4, 6, 5);
        key.castShadow = true;
        scene.add(key);
        const fill = new THREE.DirectionalLight(0xffffff, 0.8);
        fill.position.set(-4, -2, 3);
        scene.add(fill);
        const rim = new THREE.DirectionalLight(0xffffff, 0.5);
        rim.position.set(0, 4, -4);
        scene.add(rim);

        const reduced = typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const isPopup = typeof URLSearchParams !== "undefined" &&
          new URLSearchParams(window.location.search).has("popup");

        const HOVER_PERIOD_S = 3.45;
        const yLo  = -0.065;
        const yHi  =  0.095;
        const yMid = (yLo + yHi) / 2;
        const yAmp = (yHi - yLo) / 2;
        const yawBase  = 0.11;
        const yawSwing = 0.055;
        let t0 = performance.now();

        const group = new THREE.Group();
        scene.add(group);

        const loader = new THREE.GLTFLoader();
        loader.load(
          "hxouse-abe-lanyard.glb",
          function (gltf) {
            const model = gltf.scene;

            /* Centre and scale to fit the view */
            const box    = new THREE.Box3().setFromObject(model);
            const centre = box.getCenter(new THREE.Vector3());
            const size   = box.getSize(new THREE.Vector3());
            model.position.sub(centre);

            const maxDim   = Math.max(size.x, size.y, size.z);
            const vFov     = (camera.fov * Math.PI) / 180;
            const fitDist  = (maxDim / 2) / Math.tan(vFov / 2) * 1.08;
            camera.position.z = fitDist;
            camera.updateProjectionMatrix();

            /* Enable shadows on all meshes */
            model.traverse(function (node) {
              if (node.isMesh) {
                node.castShadow    = true;
                node.receiveShadow = true;
              }
            });

            group.add(model);
          },
          undefined,
          function (err) { console.error("GLB load error:", err); }
        );

        function resize() {
          const rw = Math.max(1, wrap.clientWidth);
          const rh = Math.max(1, wrap.clientHeight);
          renderer.setSize(rw, rh, false);
          camera.aspect = rw / rh;
          camera.updateProjectionMatrix();
        }

        function animate() {
          requestAnimationFrame(animate);
          if (!reduced) {
            const elapsed = (performance.now() - t0) / 1000;
            const phase   = (2 * Math.PI * elapsed) / HOVER_PERIOD_S;
            group.position.y = yMid + yAmp * Math.cos(phase);
            if (isPopup) {
              group.rotation.y += 0.018;
            } else {
              group.rotation.y = yawBase + yawSwing * Math.sin(phase * 0.6);
            }
          } else {
            group.position.y = 0;
            if (!isPopup) group.rotation.y = yawBase;
          }
          renderer.render(scene, camera);
        }

        if (typeof ResizeObserver !== "undefined") {
          new ResizeObserver(resize).observe(wrap);
        } else {
          window.addEventListener("resize", resize);
        }
        resize();
        animate();
      })();
    </script>
  </body>
</html>
