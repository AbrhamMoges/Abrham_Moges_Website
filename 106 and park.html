<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>106 &amp; Park — 3D preview</title>
    <style>
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        scrollbar-width: none;
      }
      html::-webkit-scrollbar { display: none; }
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        scrollbar-width: none;
      }
      body::-webkit-scrollbar { display: none; }
      #wrap {
        width: 100%;
        max-width: 720px;
        aspect-ratio: 1 / 1;
        overflow: visible;
      }
      #c {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="c"></canvas></div>

    <script src="lib/three.r128.min.js"></script>
    <script>
      const wrap = document.getElementById("wrap");
      const canvas = document.getElementById("c");

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true,
      });
      renderer.setClearColor(0x000000, 0);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
      camera.position.set(0, 0.4, 10);
      camera.lookAt(0, 0, 0);

      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const key = new THREE.DirectionalLight(0xffffff, 1.3);
      key.position.set(6, 10, 8);
      key.castShadow = true;
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xffd0ff, 0.25);
      rim.position.set(-6, 2, -2);
      scene.add(rim);

      function makeTex(bg, lines) {
        const c = document.createElement("canvas");
        c.width = 512;
        c.height = 512;
        const ctx = c.getContext("2d");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, 512, 512);
        ctx.fillStyle = "rgba(255,255,255,0.13)";
        ctx.fillRect(0, 0, 512, 200);
        lines.forEach((l) => {
          ctx.fillStyle = l.color || "#ffffff";
          ctx.font = `bold ${l.size}px Arial Black, Arial`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(l.text, 256, l.y);
        });
        return new THREE.CanvasTexture(c);
      }

      function makeBox(w, h, d, frontTex, sideHex, topHex) {
        const g = new THREE.BoxGeometry(w, h, d);
        const s = new THREE.Color(sideHex);
        const dark = new THREE.Color(sideHex).multiplyScalar(0.6);
        return new THREE.Mesh(g, [
          new THREE.MeshLambertMaterial({ color: s }),
          new THREE.MeshLambertMaterial({ color: s }),
          new THREE.MeshLambertMaterial({ color: new THREE.Color(topHex) }),
          new THREE.MeshLambertMaterial({ color: dark }),
          typeof frontTex === "string"
            ? new THREE.MeshLambertMaterial({ color: new THREE.Color(frontTex) })
            : new THREE.MeshLambertMaterial({ map: frontTex }),
          new THREE.MeshLambertMaterial({ color: dark }),
        ]);
      }

      const group = new THREE.Group();

      const orangeTex = makeTex("#F7941D", [
        { text: "106", size: 205, y: 200 },
        { text: "&PARK", size: 90, y: 370 },
      ]);
      const orange = makeBox(3.6, 3.6, 0.75, orangeTex, 0xb85e00, 0xffb347);
      orange.rotation.z = 0.07;
      orange.rotation.y = -0.12;
      orange.position.set(-0.3, 0.1, 0);
      group.add(orange);

      const purple = makeBox(2.4, 2.4, 0.65, "#5a4aaa", 0x3d2d80, 0x8070cc);
      purple.rotation.z = 0.3;
      purple.rotation.y = 0.35;
      purple.position.set(2.1, 1.0, -0.9);
      group.add(purple);

      const pink = makeBox(1.5, 1.5, 0.55, "#dd1188", 0xaa0060, 0xff70c0);
      pink.rotation.z = -0.5;
      pink.rotation.y = -0.4;
      pink.position.set(-2.8, -0.5, -0.3);
      group.add(pink);

      const liveC = document.createElement("canvas");
      liveC.width = 512;
      liveC.height = 256;
      const lctx = liveC.getContext("2d");
      lctx.fillStyle = "#29b8e0";
      lctx.fillRect(0, 0, 512, 256);
      lctx.fillStyle = "rgba(255,255,255,0.15)";
      lctx.fillRect(0, 0, 512, 90);
      lctx.fillStyle = "#ffffff";
      lctx.font = "bold 130px Arial Black, Arial";
      lctx.textAlign = "center";
      lctx.textBaseline = "middle";
      lctx.fillText("LIVE", 256, 135);
      const liveTex = new THREE.CanvasTexture(liveC);

      const liveG = new THREE.BoxGeometry(2.0, 0.85, 0.5);
      const liveM = new THREE.Mesh(liveG, [
        new THREE.MeshLambertMaterial({ color: 0x147a99 }),
        new THREE.MeshLambertMaterial({ color: 0x147a99 }),
        new THREE.MeshLambertMaterial({ color: 0x6dd5f0 }),
        new THREE.MeshLambertMaterial({ color: 0x0d5266 }),
        new THREE.MeshLambertMaterial({ map: liveTex }),
        new THREE.MeshLambertMaterial({ color: 0x0d5266 }),
      ]);
      liveM.rotation.z = 0.05;
      liveM.rotation.y = 0.1;
      liveM.position.set(1.1, -2.0, 0.4);
      group.add(liveM);

      group.scale.set(0.64, 0.64, 0.64);
      scene.add(group);

      const reduced =
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const HOVER_PERIOD_S = 3.2;
      const yAmp = 0.18;
      const yMid = 0;
      let t0 = performance.now();

      function resize() {
        const rect = wrap.getBoundingClientRect();
        const dim = rect.width || 1;
        const h = rect.height || dim;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(dim, h, false);
        camera.aspect = dim / Math.max(h, 1);
        camera.updateProjectionMatrix();
      }

      const isPopup = new URLSearchParams(window.location.search).get('popup') === '1';
      function animate() {
        requestAnimationFrame(animate);
        if (!reduced) {
          const elapsed = (performance.now() - t0) / 1000;
          const phase = (2 * Math.PI * elapsed) / HOVER_PERIOD_S;
          group.position.y = yMid + yAmp * Math.cos(phase);
          if (isPopup) group.rotation.y += 0.012;
        } else {
          group.position.y = 0;
        }
        renderer.render(scene, camera);
      }

      if (typeof ResizeObserver !== "undefined") {
        new ResizeObserver(() => resize()).observe(wrap);
      } else {
        window.addEventListener("resize", resize);
      }
      resize();
      animate();
    </script>
  </body>
</html>
