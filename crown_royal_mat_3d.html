<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crown Royal — bar mat 3D</title>
    <style>
      html {
        background: transparent;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #wrap {
        width: 100%;
        height: 100%;
        max-width: min(380px, 62vmin);
        max-height: min(380px, 62vmin);
        aspect-ratio: 1 / 1;
        box-sizing: border-box;
      }
      #c {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="wrap"><canvas id="c"></canvas></div>

    <script src="lib/three.r128.min.js"></script>
    <script>
      (function () {
        const wrap = document.getElementById("wrap");
        const canvas = document.getElementById("c");

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setClearColor(0x000000, 0);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(42, 1, 0.05, 200);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const d1 = new THREE.DirectionalLight(0xffffff, 1.0);
        d1.position.set(4, 4, 8);
        scene.add(d1);
        const d2 = new THREE.DirectionalLight(0xc8a0ff, 0.4);
        d2.position.set(-4, 0, 3);
        scene.add(d2);

        const group = new THREE.Group();
        group.rotation.x = 0.1;
        scene.add(group);

        const reduced =
          typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const isPopup = typeof URLSearchParams !== "undefined" &&
          new URLSearchParams(window.location.search).has("popup");

        const HOVER_PERIOD_S = 3.2;
        const yLo = -0.05;
        const yHi = 0.11;
        const yMid = (yLo + yHi) / 2;
        const yAmp = (yHi - yLo) / 2;
        const yawBase = 0.11;
        const yawSwing = 0.055;
        let t0 = performance.now();

        const depth = 0.55;
        let matW = 5.0;
        let matH = 5.0;

        function fitCamera(rw, rh) {
          camera.aspect = rw / rh;
          const vFov = (camera.fov * Math.PI) / 180;
          const margin = 0.90;
          const viewAspect = rw / rh;
          const imgAspect = matW / matH;
          let dist;
          if (viewAspect >= imgAspect) {
            dist = matH / 2 / Math.tan(vFov / 2) / margin;
          } else {
            const hFov = 2 * Math.atan(Math.tan(vFov / 2) * viewAspect);
            dist = matW / 2 / Math.tan(hFov / 2) / margin;
          }
          camera.position.set(0, 0, dist);
          camera.lookAt(0, 0, 0);
          camera.updateProjectionMatrix();
        }

        // Measured mat bounds within the 1024×1024 PNG (non-black pixel region)
        const PX_L = 30, PX_R = 1013, PX_T = 196, PX_B = 851, IMG = 1024;
        const uvL = PX_L / IMG;
        const uvR = PX_R / IMG;
        const uvVBot = 1 - PX_B / IMG; // Three.js v=0 at bottom of texture
        const uvVTop = 1 - PX_T / IMG;

        // Use the mat's actual 3:2 aspect ratio
        const matAspect = (PX_R - PX_L) / (PX_B - PX_T); // ≈ 1.5
        const longSide = 5.0;
        matW = longSide;
        matH = longSide / matAspect;

        const hw = matW / 2;
        const hh = matH / 2;

        const shape = new THREE.Shape();
        shape.moveTo(-hw, -hh);
        shape.lineTo( hw, -hh);
        shape.lineTo( hw,  hh);
        shape.lineTo(-hw,  hh);
        shape.closePath();

        const sideGeo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
        const sideMesh = new THREE.Mesh(sideGeo, [
          new THREE.MeshLambertMaterial({ color: 0x1a0830 }),
          new THREE.MeshLambertMaterial({ color: 0x0d0420 }),
        ]);
        sideMesh.position.z = -depth / 2;

        const faceGeo = new THREE.ShapeGeometry(shape);

        fitCamera(Math.max(1, wrap.clientWidth), Math.max(1, wrap.clientHeight));

        const loader = new THREE.TextureLoader();
        loader.load("crown-royal-mat.png", function (texture) {
          texture.encoding = THREE.sRGBEncoding;
          texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

          // Remap UVs to only the mat sub-region of the PNG
          const posA = faceGeo.attributes.position;
          const uvA  = faceGeo.attributes.uv;
          for (let i = 0; i < posA.count; i++) {
            const nx = (posA.getX(i) + hw) / matW; // 0..1 across shape
            const ny = (posA.getY(i) + hh) / matH; // 0..1 up shape
            uvA.setXY(i,
              uvL + nx * (uvR  - uvL),
              uvVBot + ny * (uvVTop - uvVBot)
            );
          }
          uvA.needsUpdate = true;

          const faceMesh = new THREE.Mesh(
            faceGeo,
            new THREE.MeshBasicMaterial({ map: texture })
          );
          faceMesh.position.z = depth / 2 + 0.005;

          group.add(sideMesh);
          group.add(faceMesh);
        });

        function resize() {
          const rw = Math.max(1, wrap.clientWidth);
          const rh = Math.max(1, wrap.clientHeight);
          renderer.setSize(rw, rh, false);
          fitCamera(rw, rh);
        }

        function animate() {
          requestAnimationFrame(animate);
          if (!reduced) {
            const elapsed = (performance.now() - t0) / 1000;
            const phase = (2 * Math.PI * elapsed) / HOVER_PERIOD_S;
            group.position.y = yMid + yAmp * Math.cos(phase);
            if (isPopup) {
              group.rotation.y += 0.022;
            } else {
              group.rotation.y = yawBase + yawSwing * Math.sin(phase * 0.6);
            }
          } else {
            group.position.y = 0;
            if (!isPopup) group.rotation.y = yawBase;
          }
          renderer.render(scene, camera);
        }

        if (typeof ResizeObserver !== "undefined") {
          new ResizeObserver(resize).observe(wrap);
        } else {
          window.addEventListener("resize", resize);
        }
        resize();
        animate();
      })();
    </script>
  </body>
</html>
